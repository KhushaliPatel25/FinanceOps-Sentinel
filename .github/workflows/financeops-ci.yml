
name: FinanceOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-financial-pipeline:
    name: Build, Reconcile and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate synthetic financial data
        run: python src/01_generate_synthetic_data.py

      - name: Validate source datasets
        run: python src/02_validate_data.py

      - name: Build SQLite database
        run: python src/03_build_database.py

      - name: Generate reconciliation reports
        run: python src/04_generate_reconciliation_reports.py

      - name: Run automated tests
        run: python -m pytest -q tests/
